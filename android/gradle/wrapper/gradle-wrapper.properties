# 想换回官方源就把下面这行改回 https\://services.gradle.org/distributions/gradle-8.14.3-all.zip
distributionUrl=https\://mirrors.huaweicloud.com/gradle/gradle-8.14.3-all.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
