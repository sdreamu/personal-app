<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0065D1" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- 静态 HTML 里拿不到 src/config/app.ts 的 APP_NAME，标题与下方启动占位都与之保持一致 -->
    <title>个人生活助手</title>
  </head>
  <body>
    <!-- 挂载前的占位：启动要读数据库，别让用户对着白屏等。Vue 挂载时会整块替换掉 -->
    <div id="app">
      <div class="boot-splash">
        <span class="boot-splash-mark">个人生活助手</span>
        <span class="boot-splash-text">正在启动…</span>
      </div>
    </div>
    <style>
      .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        font-family: 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
        background: #edf2f9;
        color: #12352A;
      }
      .boot-splash-mark {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      .boot-splash-text {
        font-size: 13px;
        color: #62626b;
      }
    [data-theme='dark'] .boot-splash { background: #060c16; color: #f5f5f7; }
      [data-theme='dark'] .boot-splash-text { color: #a5a5b0; }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
